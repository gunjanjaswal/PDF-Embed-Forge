<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="PDF Forge">
  <defs>
    <linearGradient id="pf-outer" x1="128" y1="16" x2="128" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2d3760"/>
      <stop offset="1" stop-color="#141a30"/>
    </linearGradient>
    <linearGradient id="pf-tile" x1="128" y1="54" x2="128" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a74"/>
      <stop offset="0.55" stop-color="#f23b4e"/>
      <stop offset="1" stop-color="#db1f3c"/>
    </linearGradient>
    <linearGradient id="pf-sheen" x1="128" y1="16" x2="128" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="pf-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000000" flood-opacity="0.33"/>
    </filter>
  </defs>

  <!-- Outer squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#pf-outer)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#pf-sheen)"/>

  <!-- Inner tile with soft shadow -->
  <rect x="58" y="54" width="140" height="140" rx="34" fill="url(#pf-tile)" filter="url(#pf-shadow)"/>

  <!-- Document glyph -->
  <g fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 86 H145 L162 103 V166 H100 Z"/>
    <path d="M145 86 V103 H162"/>
    <line x1="112" y1="122" x2="150" y2="122"/>
    <line x1="112" y1="137" x2="150" y2="137"/>
    <line x1="112" y1="152" x2="136" y2="152"/>
  </g>
</svg>
