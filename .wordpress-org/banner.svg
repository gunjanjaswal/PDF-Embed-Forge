<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500" role="img" aria-label="PDF Embed Forge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1544" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171d37"/>
      <stop offset="1" stop-color="#0e1226"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#f23b4e" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f23b4e" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="pf-outer-b" x1="1298" y1="98" x2="1298" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2d3760"/>
      <stop offset="1" stop-color="#141a30"/>
    </linearGradient>
    <linearGradient id="pf-tile-b" x1="1298" y1="149" x2="1298" y2="351" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a74"/>
      <stop offset="0.55" stop-color="#f23b4e"/>
      <stop offset="1" stop-color="#db1f3c"/>
    </linearGradient>
    <linearGradient id="pf-sheen-b" x1="1298" y1="98" x2="1298" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="pf-shadow-b" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1544" height="500" fill="url(#bg)"/>
  <rect width="1544" height="500" fill="url(#glow)"/>

  <!-- Wordmark -->
  <text x="116" y="212" font-family="'Helvetica Neue','Arial',sans-serif" font-weight="800" font-size="104" letter-spacing="-3" fill="#ffffff">PDF Embed <tspan fill="#f8505f">Forge</tspan></text>

  <!-- Tagline -->
  <text x="120" y="292" font-family="'Helvetica Neue','Arial',sans-serif" font-weight="600" font-size="37" fill="#c7cfe2">Embed PDFs directly in your posts and pages.</text>

  <!-- Feature line -->
  <text x="120" y="352" font-family="'Helvetica Neue','Arial',sans-serif" font-weight="500" font-size="27" fill="#8b93ad">Block &amp; shortcode        &#183;        no external services</text>

  <!-- App icon -->
  <g transform="translate(1150 98) scale(1.1875)">
    <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#pf-outer-b)"/>
    <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#pf-sheen-b)"/>
    <rect x="58" y="54" width="140" height="140" rx="34" fill="url(#pf-tile-b)" filter="url(#pf-shadow-b)"/>
    <g fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 86 H145 L162 103 V166 H100 Z"/>
      <path d="M145 86 V103 H162"/>
      <line x1="112" y1="122" x2="150" y2="122"/>
      <line x1="112" y1="137" x2="150" y2="137"/>
      <line x1="112" y1="152" x2="136" y2="152"/>
    </g>
  </g>
</svg>
